name: Frontend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENABLE_FRONTEND_TESTS: ${{ vars.ENABLE_FRONTEND_TESTS || 'false' }}
    steps:
      - name: Skip frontend tests (temporary)
        if: env.ENABLE_FRONTEND_TESTS != 'true'
        run: |
          echo "Frontend CI tests are temporarily disabled due to instability."
          echo "Set repository variable ENABLE_FRONTEND_TESTS=true to re-enable."
      - uses: actions/checkout@v4
        if: env.ENABLE_FRONTEND_TESTS == 'true'
      - uses: actions/setup-node@v4
        if: env.ENABLE_FRONTEND_TESTS == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: env.ENABLE_FRONTEND_TESTS == 'true'
      - run: npm run test
        if: env.ENABLE_FRONTEND_TESTS == 'true'
      - run: npx playwright install --with-deps
        if: env.ENABLE_FRONTEND_TESTS == 'true'
      - run: npm run e2e
        if: env.ENABLE_FRONTEND_TESTS == 'true'
      - name: Upload Playwright report
        if: env.ENABLE_FRONTEND_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload test results
        if: env.ENABLE_FRONTEND_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
